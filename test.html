<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧠 Knowledge Base Agent</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css"
        media="(prefers-color-scheme: light)">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css"
        media="(prefers-color-scheme: dark)">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/common.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f7f8fa;
      --bg-alt: #ffffff;
      --rail-bg: #edeff3;
      --panel: #ffffff;
      --line: #e5e7eb;
      --line-strong: #d1d5db;
      --text: #1f2937;
      --text-dim: #6b7280;
      --label: #374151;
      --accent: #3b82f6;
      --accent-soft: rgba(59,130,246,0.12);
      --user-bubble: linear-gradient(135deg, #dbeafe, #bfdbfe);
      --user-text: #1e3a8a;
      --code-bg: #f6f8fa;
      --code-border: #e5e7eb;
      --hover: rgba(0,0,0,0.05);
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --shadow-panel: 0 12px 40px -12px rgba(0,0,0,0.22), 0 2px 8px -4px rgba(0,0,0,0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --bg-alt: #171a1f;
        --rail-bg: #0b0d11;
        --panel: #1c1f26;
        --line: #272b33;
        --line-strong: #353a43;
        --text: #e8eaed;
        --text-dim: #9aa1ab;
        --label: #c4c8ce;
        --accent: #60a5fa;
        --accent-soft: rgba(96,165,250,0.16);
        --user-bubble: linear-gradient(135deg, #1e3a8a, #1e40af);
        --user-text: #bfdbfe;
        --code-bg: #1a1d23;
        --code-border: #2a2e36;
        --hover: rgba(255,255,255,0.06);
        --success: #34d399;
        --danger: #f87171;
        --warning: #fbbf24;
        --shadow-panel: 0 12px 40px -12px rgba(0,0,0,0.6), 0 2px 8px -4px rgba(0,0,0,0.4);
      }
    }

    html, body { height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
      height: 100dvh;
      width: 100%;
    }

    /* ═══════════════════════════════════════════════
       Icon rail (always visible)
    ═══════════════════════════════════════════════ */
    .rail {
      width: 60px;
      flex-shrink: 0;
      background: var(--rail-bg);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem 0;
      gap: 0.35rem;
      z-index: 40;
      position: relative;
    }
    .rail-logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      margin-bottom: 0.75rem;
      box-shadow: 0 4px 12px -4px rgba(59,130,246,0.5);
    }
    .rail-btn {
      position: relative;
      width: 42px;
      height: 42px;
      border-radius: 11px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s, transform 0.1s;
    }
    .rail-btn:hover {
      background: var(--hover);
      color: var(--text);
    }
    .rail-btn:active { transform: scale(0.94); }
    .rail-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .rail-btn.active::before {
      content: "";
      position: absolute;
      left: -12px;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 22px;
      background: var(--accent);
      border-radius: 0 3px 3px 0;
    }
    /* Tooltips */
    .rail-btn::after {
      content: attr(data-label);
      position: absolute;
      left: calc(100% + 10px);
      top: 50%;
      transform: translateY(-50%) translateX(-6px);
      background: #1f2937;
      color: #ffffff;
      padding: 0.32rem 0.6rem;
      border-radius: 7px;
      font-size: 0.72rem;
      font-weight: 500;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s, transform 0.15s;
      z-index: 100;
      box-shadow: 0 4px 12px -4px rgba(0,0,0,0.3);
    }
    .rail-btn:hover::after {
      opacity: 1;
      transform: translateY(-50%) translateX(0);
    }
    .rail-spacer { flex: 1; }
    .rail-status {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      padding: 0.6rem 0 0;
      font-size: 0.62rem;
      color: var(--text-dim);
      border-top: 1px solid var(--line);
      width: 36px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      transition: background 0.2s;
    }
    .dot.err { background: var(--danger); }
    .dot.load { background: var(--warning); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* ═══════════════════════════════════════════════
       Pop-out sidebar
    ═══════════════════════════════════════════════ */
    .sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 60px;
      width: 340px;
      background: var(--panel);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      transform: translateX(-105%);
      transition: transform 0.32s cubic-bezier(0.32, 0.72, 0.24, 1);
      z-index: 35;
      box-shadow: var(--shadow-panel);
      will-change: transform;
    }
    .sidebar.open { transform: translateX(0); }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1rem 0.85rem;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .sidebar-title {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--text-dim);
    }
    .sidebar-close {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .sidebar-close:hover {
      background: var(--hover);
      color: var(--text);
    }

    .sidebar-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0.4rem 0;
    }
    .sidebar-body::-webkit-scrollbar { width: 6px; }
    .sidebar-body::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }

    /* ── Accordion sections ── */
    .side-section {
      border-bottom: 1px solid var(--line);
    }
    .side-section:last-child { border-bottom: none; }

    .side-section-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      padding: 0.85rem 1rem;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s;
    }
    .side-section-header:hover { background: var(--hover); }
    .side-section.open .side-section-header { color: var(--accent); }
    .side-section-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.15s;
    }
    .side-section.open .side-section-icon {
      background: var(--accent-soft);
      transform: scale(1.05);
    }
    .side-section-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .side-section-badge {
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--text-dim);
      background: var(--bg);
      padding: 0.15rem 0.5rem;
      border-radius: 20px;
      border: 1px solid var(--line);
      margin-right: 0.15rem;
    }
    .side-section-chevron {
      font-size: 0.75rem;
      color: var(--text-dim);
      transition: transform 0.25s ease;
      flex-shrink: 0;
    }
    .side-section.open .side-section-chevron {
      transform: rotate(90deg);
      color: var(--accent);
    }

    .side-section-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s cubic-bezier(0.32, 0.72, 0.24, 1);
    }
    .side-section.open .side-section-body {
      max-height: 800px;
    }
    .side-section-content {
      padding: 0.2rem 1rem 1.1rem 1rem;
    }

    /* ── Fields / buttons (shared) ── */
    .field { margin-bottom: 0.7rem; }
    .field:last-child { margin-bottom: 0; }
    .field label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--label);
      margin-bottom: 0.28rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .field input {
      width: 100%;
      padding: 0.55rem 0.75rem;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .field input:focus {
      border-color: var(--accent);
      background: var(--panel);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.55rem 0.9rem;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      background: var(--panel);
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .btn:hover:not(:disabled) { background: var(--hover); }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .btn.primary:hover:not(:disabled) { background: #2563eb; border-color: #2563eb; }
    .btn.wide { width: 100%; }
    .btn.mini {
      padding: 0.32rem 0.55rem;
      font-size: 0.7rem;
      border-radius: 7px;
    }

    /* ── Tools grid ── */
    .tools-actions {
      display: flex;
      gap: 0.3rem;
      margin-bottom: 0.55rem;
      flex-wrap: wrap;
    }
    .tools-list {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;
      margin-right: -4px;
    }
    .tools-list::-webkit-scrollbar { width: 5px; }
    .tools-list::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }
    .tools-list .empty {
      color: var(--text-dim);
      font-size: 0.78rem;
      font-style: italic;
      padding: 0.5rem 0;
      text-align: center;
    }
    .tool-item {
      display: flex;
      align-items: flex-start;
      gap: 0.55rem;
      padding: 0.5rem 0.65rem;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--bg);
      cursor: pointer;
      user-select: none;
      transition: background 0.12s, border-color 0.12s, transform 0.1s;
    }
    .tool-item:hover { background: var(--panel); border-color: var(--line-strong); }
    .tool-item:active { transform: scale(0.99); }
    .tool-item.on {
      background: var(--accent-soft);
      border-color: var(--accent);
    }
    .tool-check {
      width: 15px;
      height: 15px;
      border-radius: 4px;
      border: 1.5px solid var(--line-strong);
      flex-shrink: 0;
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s, border-color 0.12s;
      font-size: 0.62rem;
      color: white;
      line-height: 1;
    }
    .tool-item.on .tool-check {
      background: var(--accent);
      border-color: var(--accent);
    }
    .tool-item.on .tool-check::after { content: "✓"; }
    .tool-meta { min-width: 0; flex: 1; }
    .tool-name {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text);
      word-break: break-all;
      line-height: 1.3;
    }
    .tool-desc {
      font-size: 0.68rem;
      color: var(--text-dim);
      margin-top: 2px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ── Health ── */
    .health-status {
      font-size: 0.76rem;
      color: var(--text-dim);
      margin-top: 0.55rem;
      line-height: 1.5;
    }
    .health-status.ok { color: var(--success); }
    .health-status.err { color: var(--danger); }
    .health-details {
      margin-top: 0.5rem;
      font-size: 0.72rem;
      color: var(--text-dim);
      background: var(--bg);
      padding: 0.55rem 0.7rem;
      border-radius: 8px;
      border: 1px solid var(--line);
      line-height: 1.6;
    }
    .health-details strong { color: var(--label); }
    .health-details .mcp-server {
      display: inline-block;
      background: var(--panel);
      padding: 0.08rem 0.5rem;
      border-radius: 20px;
      font-size: 0.68rem;
      border: 1px solid var(--line);
      margin: 0.15rem 0.2rem 0 0;
    }

    /* ═══════════════════════════════════════════════
       Chat main
    ═══════════════════════════════════════════════ */
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg);
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.7rem 1.25rem;
      border-bottom: 1px solid var(--line);
      background: var(--bg-alt);
      flex-shrink: 0;
      min-height: 58px;
    }
    .chat-user {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      font-size: 0.9rem;
      min-width: 0;
    }
    .chat-user .uname {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 45vw;
    }
    .chat-user .badge {
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--text-dim);
      background: var(--panel);
      padding: 0.15rem 0.55rem;
      border-radius: 20px;
      border: 1px solid var(--line);
    }
    .chat-header .spacer { flex: 1; }

    /* ── Message area ── */
    .chat-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }
    .chat-scroll::-webkit-scrollbar { width: 8px; }
    .chat-scroll::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; }

    .chat-column {
      max-width: 800px;
      margin: 0 auto;
      padding: 1.6rem 1.5rem 1.5rem;
    }
    .chat-box { display: flex; flex-direction: column; }

    .message {
      margin: 1.2rem 0;
      font-size: 0.97rem;
      line-height: 1.65;
      word-wrap: break-word;
      animation: fadeUp 0.22s ease;
    }
    .message.user {
      background: var(--user-bubble);
      color: var(--user-text);
      padding: 0.75rem 1.05rem;
      border-radius: 18px;
      border-bottom-right-radius: 4px;
      margin-left: auto;
      max-width: min(600px, 85%);
      width: fit-content;
      white-space: pre-wrap;
    }
    .message.assistant { color: var(--text); margin-right: auto; max-width: 100%; }
    .message.error {
      background: rgba(239,68,68,0.1);
      color: var(--danger);
      padding: 0.7rem 1rem;
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 12px;
      white-space: pre-wrap;
      font-size: 0.9rem;
    }
    .message.system-note {
      color: var(--text-dim);
      font-size: 0.82rem;
      text-align: center;
      padding: 0.6rem 0;
      border-top: 1px dashed var(--line);
      border-bottom: 1px dashed var(--line);
      margin: 1.5rem 0;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* Markdown */
    .message.assistant > *:first-child { margin-top: 0; }
    .message.assistant > *:last-child { margin-bottom: 0; }
    .message.assistant h1,
    .message.assistant h2,
    .message.assistant h3,
    .message.assistant h4 {
      font-weight: 700;
      margin: 1.1rem 0 0.5rem;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }
    .message.assistant h1 { font-size: 1.35rem; }
    .message.assistant h2 { font-size: 1.18rem; }
    .message.assistant h3 { font-size: 1.05rem; }
    .message.assistant h4 { font-size: 0.98rem; color: var(--text-dim); }
    .message.assistant p { margin: 0.6rem 0; }
    .message.assistant ul,
    .message.assistant ol { margin: 0.6rem 0 0.6rem 1.4rem; }
    .message.assistant li { margin: 0.25rem 0; }
    .message.assistant li > p { margin: 0; }
    .message.assistant strong { font-weight: 650; }
    .message.assistant code:not(pre code) {
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 5px;
      padding: 0.1em 0.38em;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.87em;
    }
    .message.assistant pre {
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      overflow-x: auto;
      margin: 0.8rem 0;
      font-size: 0.84rem;
      line-height: 1.5;
    }
    .message.assistant pre code {
      background: transparent;
      border: none;
      padding: 0;
      font-size: inherit;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .message.assistant blockquote {
      border-left: 3px solid var(--accent);
      background: var(--panel);
      padding: 0.5rem 0.9rem;
      margin: 0.7rem 0;
      color: var(--text-dim);
      border-radius: 0 8px 8px 0;
    }
    .message.assistant table {
      border-collapse: collapse;
      margin: 0.7rem 0;
      width: 100%;
      font-size: 0.87rem;
    }
    .message.assistant th,
    .message.assistant td {
      border: 1px solid var(--line);
      padding: 0.4rem 0.7rem;
      text-align: left;
    }
    .message.assistant th { background: var(--panel); font-weight: 600; }
    .message.assistant a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
    .message.assistant hr { border: none; border-top: 1px solid var(--line); margin: 1rem 0; }

    /* ═══════════════════════════════════════════════
       Composer
    ═══════════════════════════════════════════════ */
    .composer {
      flex-shrink: 0;
      padding: 0.7rem 1.5rem 1rem;
      background: var(--bg);
    }
    .composer-inner {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
      background: var(--panel);
      border: 1px solid var(--line-strong);
      border-radius: 24px;
      padding: 0.4rem 0.4rem 0.4rem 1.1rem;
      box-shadow: 0 4px 16px -8px rgba(0,0,0,0.14);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .composer-inner:focus-within {
      border-color: var(--accent);
      box-shadow: 0 4px 16px -8px rgba(59,130,246,0.35), 0 0 0 3px var(--accent-soft);
    }
    .composer textarea {
      flex: 1;
      border: none;
      background: transparent;
      resize: none;
      outline: none;
      font-size: 0.95rem;
      line-height: 1.5;
      max-height: 220px;
      min-height: 24px;
      padding: 0.5rem 0;
      color: var(--text);
      font-family: inherit;
    }
    .composer textarea::placeholder { color: var(--text-dim); }
    .send-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      flex-shrink: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      background: var(--accent);
      color: white;
      border: none;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }
    .send-btn:hover:not(:disabled) { transform: scale(1.06); }
    .send-btn:disabled { background: var(--line-strong); cursor: not-allowed; }
    .composer-hint {
      max-width: 800px;
      margin: 0.45rem auto 0;
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-dim);
    }

    /* ═══════════════════════════════════════════════
       Mobile
    ═══════════════════════════════════════════════ */
    .backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 30;
      opacity: 0;
      transition: opacity 0.25s;
    }
    .backdrop.show { display: block; opacity: 1; }

    @media (max-width: 768px) {
      .rail { width: 54px; }
      .sidebar { left: 54px; width: min(340px, calc(100vw - 54px)); }
      .chat-header { padding: 0.7rem 1rem; min-height: 54px; }
      .chat-user .badge { display: none; }
      .chat-column { padding: 1.2rem 1rem 1rem; }
      .composer { padding: 0.6rem 0.85rem 0.85rem; }
      .composer-hint { display: none; }
      .message.user { max-width: 92%; }
    }
  </style>
</head>
<body>

<div class="app">

  <!-- ══════════════════════════════════════════════
       Icon rail
  ═══════════════════════════════════════════════ -->
  <nav class="rail" aria-label="Sections">
    <div class="rail-logo" title="Knowledge Base Agent">🧠</div>

    <button class="rail-btn" data-target="chat" data-label="Chat" aria-label="Chat">
      💬
    </button>
    <button class="rail-btn" data-target="connection" data-label="Connection" aria-label="Connection">
      🔌
    </button>
    <button class="rail-btn" data-target="tools" data-label="Tools" aria-label="Tools">
      🔧
    </button>
    <button class="rail-btn" data-target="health" data-label="Health" aria-label="Health">
      🩺
    </button>

    <div class="rail-spacer"></div>

    <div class="rail-status">
      <span class="dot" id="rail-dot"></span>
      <span id="rail-status-label">OK</span>
    </div>
  </nav>

  <!-- ══════════════════════════════════════════════
       Pop-out sidebar
  ═══════════════════════════════════════════════ -->
  <aside class="sidebar" id="sidebar" aria-hidden="true">
    <header class="sidebar-header">
      <span class="sidebar-title">Settings</span>
      <button class="sidebar-close" id="sidebar-close" aria-label="Close sidebar">✕</button>
    </header>

    <div class="sidebar-body">

      <!-- ── Chat section ── -->
      <section class="side-section" data-section="chat">
        <button class="side-section-header">
          <span class="side-section-icon">💬</span>
          <span class="side-section-title">Chat</span>
          <span class="side-section-chevron">›</span>
        </button>
        <div class="side-section-body">
          <div class="side-section-content">
            <div class="field">
              <label for="user-id">User ID</label>
              <input type="text" id="user-id" placeholder="test-user" />
            </div>
            <button class="btn wide" id="reload-history-btn">⟳ Reload history</button>
          </div>
        </div>
      </section>

      <!-- ── Connection section ── -->
      <section class="side-section" data-section="connection">
        <button class="side-section-header">
          <span class="side-section-icon">🔌</span>
          <span class="side-section-title">Connection</span>
          <span class="side-section-chevron">›</span>
        </button>
        <div class="side-section-body">
          <div class="side-section-content">
            <div class="field">
              <label for="api-url">API URL</label>
              <input type="text" id="api-url" placeholder="http://localhost:8005" />
            </div>
            <div class="field">
              <label for="bearer-token">Bearer Token</label>
              <input type="text" id="bearer-token" placeholder="optional" />
            </div>
          </div>
        </div>
      </section>

      <!-- ── Tools section ── -->
      <section class="side-section" data-section="tools">
        <button class="side-section-header">
          <span class="side-section-icon">🔧</span>
          <span class="side-section-title">Tools</span>
          <span class="side-section-badge" id="tools-count">0 / 0</span>
          <span class="side-section-chevron">›</span>
        </button>
        <div class="side-section-body">
          <div class="side-section-content">
            <div class="tools-actions">
              <button class="btn mini" id="enable-all-btn">Enable all</button>
              <button class="btn mini" id="disable-all-btn">Disable all</button>
              <button class="btn mini" id="reload-tools-btn" title="Reload tools">⟳</button>
            </div>
            <div class="tools-list" id="tools-list">
              <div class="empty">Loading tools…</div>
            </div>
          </div>
        </div>
      </section>

      <!-- ── Health section ── -->
      <section class="side-section" data-section="health">
        <button class="side-section-header">
          <span class="side-section-icon">🩺</span>
          <span class="side-section-title">Health</span>
          <span class="side-section-chevron">›</span>
        </button>
        <div class="side-section-body">
          <div class="side-section-content">
            <button class="btn wide" id="health-btn">Check health</button>
            <div class="health-status" id="health-status">Not checked</div>
            <div class="health-details" id="health-details" style="display:none;"></div>
          </div>
        </div>
      </section>

    </div>
  </aside>

  <div class="backdrop" id="backdrop"></div>

  <!-- ══════════════════════════════════════════════
       Chat main
  ═══════════════════════════════════════════════ -->
  <main class="chat-main">
    <header class="chat-header">
      <div class="chat-user">
        <span class="uname" id="chat-user-name">…</span>
        <span class="badge">active</span>
      </div>
      <div class="spacer"></div>
      <button class="btn" id="new-chat-btn" title="Start a new conversation with a fresh user ID">＋ New</button>
    </header>

    <div class="chat-scroll" id="chat-scroll">
      <div class="chat-column">
        <div class="chat-box" id="chat-box"></div>
      </div>
    </div>

    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="Message the agent…"></textarea>
        <button class="send-btn" id="send-btn" title="Send">➤</button>
      </div>
      <div class="composer-hint">Press <strong>Enter</strong> to send · <strong>Shift+Enter</strong> for newline</div>
    </div>
  </main>

</div>

<script>
  (function() {
    // ── DOM refs ──
    const sidebar       = document.getElementById('sidebar');
    const sidebarClose  = document.getElementById('sidebar-close');
    const backdrop      = document.getElementById('backdrop');
    const railButtons   = document.querySelectorAll('.rail-btn');
    const sections      = document.querySelectorAll('.side-section');

    const userIdInput    = document.getElementById('user-id');
    const reloadHistory  = document.getElementById('reload-history-btn');
    const apiUrlInput    = document.getElementById('api-url');
    const bearerInput    = document.getElementById('bearer-token');

    const toolsList      = document.getElementById('tools-list');
    const toolsCount     = document.getElementById('tools-count');
    const enableAllBtn   = document.getElementById('enable-all-btn');
    const disableAllBtn  = document.getElementById('disable-all-btn');
    const reloadToolsBtn = document.getElementById('reload-tools-btn');

    const healthBtn      = document.getElementById('health-btn');
    const healthStatus   = document.getElementById('health-status');
    const healthDetails  = document.getElementById('health-details');

    const railDot        = document.getElementById('rail-dot');
    const railLabel      = document.getElementById('rail-status-label');

    const chatScroll     = document.getElementById('chat-scroll');
    const chatBox        = document.getElementById('chat-box');
    const chatUserName   = document.getElementById('chat-user-name');
    const newChatBtn     = document.getElementById('new-chat-btn');

    const input          = document.getElementById('input');
    const sendBtn        = document.getElementById('send-btn');

    // ── State ──
    const state = {
      tools: [],
      enabled: new Set(),
      toolsLoaded: false,
      currentSection: null,
    };

    // ── Marked ──
    if (window.marked) {
      marked.setOptions({ gfm: true, breaks: true, headerIds: false, mangle: false });
    }

    // ── Utilities ──
    function randomUser() {
      const n = Math.floor(Math.random() * 900000) + 100000;
      return `test-user${n}`;
    }
    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function setStatus(msg, kind = 'ok') {
      railLabel.textContent = kind === 'err' ? 'ERR' : kind === 'load' ? '…' : 'OK';
      railDot.className = 'dot' + (kind === 'err' ? ' err' : kind === 'load' ? ' load' : '');
      railLabel.title = msg;
    }
    function baseUrl() { return apiUrlInput.value.trim().replace(/\/+$/, ''); }
    function headers() {
      const h = { 'Content-Type': 'application/json' };
      const token = bearerInput.value.trim();
      if (token) h['Authorization'] = `Bearer ${token}`;
      return h;
    }

    // ── Sidebar / section control ──
    function openSidebar(sectionName) {
      sidebar.classList.add('open');
      sidebar.setAttribute('aria-hidden', 'false');
      if (window.innerWidth <= 768) backdrop.classList.add('show');
      if (sectionName) setSection(sectionName);
    }
    function closeSidebar() {
      sidebar.classList.remove('open');
      sidebar.setAttribute('aria-hidden', 'true');
      backdrop.classList.remove('show');
      railButtons.forEach(b => b.classList.remove('active'));
      state.currentSection = null;
    }
    function setSection(name) {
      state.currentSection = name;
      sections.forEach(s => {
        s.classList.toggle('open', s.dataset.section === name);
      });
      railButtons.forEach(b => {
        b.classList.toggle('active', b.dataset.target === name);
      });
    }
    function toggleSection(name) {
      // Rail icon behaviour:
      //   closed sidebar       → open + set section
      //   open on other section → switch to this section
      //   open on same section  → close sidebar
      if (!sidebar.classList.contains('open')) {
        openSidebar(name);
      } else if (state.currentSection === name) {
        closeSidebar();
      } else {
        setSection(name);
      }
    }

    railButtons.forEach(btn => {
      btn.addEventListener('click', () => toggleSection(btn.dataset.target));
    });

    // Section header click → switch to that section
    sections.forEach(sec => {
      const header = sec.querySelector('.side-section-header');
      header.addEventListener('click', () => {
        setSection(sec.dataset.section);
      });
    });

    sidebarClose.addEventListener('click', closeSidebar);
    backdrop.addEventListener('click', closeSidebar);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && sidebar.classList.contains('open')) closeSidebar();
    });

    // ── Persistence ──
    const STORAGE_KEY = 'agent-ui-v4';
    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          apiUrl: apiUrlInput.value,
          userId: userIdInput.value,
          bearerToken: bearerInput.value,
          enabled: Array.from(state.enabled),
        }));
      } catch (_) {}
    }
    function loadState() {
      let data = null;
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) data = JSON.parse(raw);
      } catch (_) {}

      apiUrlInput.value = (data && data.apiUrl) || window.location.origin;
      userIdInput.value = (data && data.userId) || randomUser();
      bearerInput.value = (data && data.bearerToken) || '';

      state._savedEnabled = (data && Array.isArray(data.enabled)) ? data.enabled : null;
      chatUserName.textContent = userIdInput.value;
    }

    [apiUrlInput, userIdInput, bearerInput].forEach(el => {
      el.addEventListener('change', saveState);
      el.addEventListener('input', () => {
        if (el === userIdInput) chatUserName.textContent = userIdInput.value || 'unknown';
      });
    });

    // ── Markdown rendering ──
    function renderMarkdown(text) {
      if (!window.marked || !window.DOMPurify) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML.replace(/\n/g, '<br>');
      }
      return DOMPurify.sanitize(marked.parse(text), { USE_PROFILES: { html: true } });
    }
    function highlight(container) {
      if (!window.hljs) return;
      container.querySelectorAll('pre code').forEach(el => {
        try { hljs.highlightElement(el); } catch (_) {}
      });
    }

    // ── Messages ──
    function appendMessage(role, content, opts = {}) {
      const { isError = false, isSystem = false } = opts;
      const el = document.createElement('div');
      el.className = `message ${role}`;
      if (isError) el.classList.add('error');
      if (isSystem) el.classList.add('system-note');

      if (role === 'assistant' && !isError && !isSystem) {
        el.innerHTML = renderMarkdown(content);
        highlight(el);
      } else {
        el.textContent = content;
      }

      chatBox.appendChild(el);
      scrollToBottom();
    }
    function scrollToBottom() {
      requestAnimationFrame(() => { chatScroll.scrollTop = chatScroll.scrollHeight; });
    }
    function clearChat() { chatBox.innerHTML = ''; }

    // ── Tools ──
    function renderTools() {
      if (!state.tools.length) {
        toolsList.innerHTML = '<div class="empty">No tools available</div>';
        toolsCount.textContent = '0 / 0';
        return;
      }
      toolsList.innerHTML = state.tools.map(t => {
        const on = state.enabled.has(t.name);
        return `
          <div class="tool-item ${on ? 'on' : ''}" data-tool="${escapeHtml(t.name)}">
            <div class="tool-check"></div>
            <div class="tool-meta">
              <div class="tool-name">${escapeHtml(t.name)}</div>
              ${t.description ? `<div class="tool-desc">${escapeHtml(t.description)}</div>` : ''}
            </div>
          </div>
        `;
      }).join('');
      updateToolsCount();
    }
    function updateToolsCount() {
      toolsCount.textContent = `${state.enabled.size} / ${state.tools.length}`;
    }
    toolsList.addEventListener('click', (e) => {
      const item = e.target.closest('.tool-item');
      if (!item) return;
      const name = item.dataset.tool;
      if (state.enabled.has(name)) state.enabled.delete(name);
      else state.enabled.add(name);
      item.classList.toggle('on', state.enabled.has(name));
      updateToolsCount();
      saveState();
    });
    enableAllBtn.addEventListener('click', () => {
      state.enabled = new Set(state.tools.map(t => t.name));
      renderTools(); saveState();
    });
    disableAllBtn.addEventListener('click', () => {
      state.enabled = new Set();
      renderTools(); saveState();
    });

    async function loadTools() {
      setStatus('Loading tools…', 'load');
      try {
        const resp = await fetch(`${baseUrl()}/tools`, { headers: headers() });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        state.tools = Array.isArray(data.tools) ? data.tools : [];
        state.toolsLoaded = true;

        const allNames = state.tools.map(t => t.name);
        if (state._savedEnabled && Array.isArray(state._savedEnabled)) {
          const saved = new Set(state._savedEnabled.filter(n => allNames.includes(n)));
          state.enabled = saved;
        } else {
          state.enabled = new Set(allNames);
        }
        renderTools();
        setStatus(`${state.tools.length} tools`, 'ok');
      } catch (err) {
        toolsList.innerHTML = `<div class="empty">Error: ${escapeHtml(err.message)}</div>`;
        setStatus(`Tools error: ${err.message}`, 'err');
      }
    }
    reloadToolsBtn.addEventListener('click', loadTools);

    // ── Health ──
    healthBtn.addEventListener('click', async () => {
      setStatus('Checking health…', 'load');
      healthStatus.textContent = 'Checking…';
      healthStatus.className = 'health-status';
      healthDetails.style.display = 'none';
      healthBtn.disabled = true;

      try {
        const resp = await fetch(`${baseUrl()}/health`, { headers: headers() });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.detail || `HTTP ${resp.status}`);

        healthStatus.textContent = '✅ Healthy';
        healthStatus.className = 'health-status ok';

        let html = `
          <div><strong>Window:</strong> ${data.window_size}</div>
          <div><strong>Cached users:</strong> ${data.users_cached}</div>
          <div><strong>MCP (${(data.mcp_servers || []).length}):</strong> `;
        if (data.mcp_servers && data.mcp_servers.length) {
          data.mcp_servers.forEach(s => {
            html += `<span class="mcp-server">${escapeHtml(s.server)}</span> `;
          });
        } else { html += 'None'; }
        html += '</div>';

        healthDetails.innerHTML = html;
        healthDetails.style.display = 'block';
        setStatus('Health OK', 'ok');
      } catch (err) {
        healthStatus.textContent = `❌ ${err.message}`;
        healthStatus.className = 'health-status err';
        healthDetails.innerHTML = `<div>${escapeHtml(err.message)}</div>`;
        healthDetails.style.display = 'block';
        setStatus(`Health error: ${err.message}`, 'err');
      } finally {
        healthBtn.disabled = false;
      }
    });

    // ── History ──
    async function loadHistory(showEmpty = true) {
      const user = userIdInput.value.trim() || 'test-user';
      setStatus('Loading history…', 'load');
      try {
        const resp = await fetch(`${baseUrl()}/history`, {
          method: 'POST',
          headers: headers(),
          body: JSON.stringify({ user }),
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.detail || `HTTP ${resp.status}`);

        clearChat();
        const messages = data.messages || [];
        if (!messages.length) {
          if (showEmpty) {
            appendMessage('assistant',
              `No history for **${user}**. Start a conversation.`,
              { isSystem: true });
          }
          setStatus('No history', 'ok');
          return;
        }
        messages.forEach(m => appendMessage(m.role, m.content));
        setStatus(`Loaded ${messages.length} messages`, 'ok');
      } catch (err) {
        setStatus(`History error: ${err.message}`, 'err');
      }
    }
    reloadHistory.addEventListener('click', () => loadHistory(true));

    // ── New chat ──
    newChatBtn.addEventListener('click', () => {
      const newUser = randomUser();
      userIdInput.value = newUser;
      chatUserName.textContent = newUser;
      saveState();
      clearChat();
      appendMessage('assistant',
        `Started new conversation as **${newUser}**.`,
        { isSystem: true });
      setStatus('New chat', 'ok');
      input.focus();
    });

    // ── Tools payload ──
    function toolsPayload() {
      if (!state.toolsLoaded || state.tools.length === 0) return null;
      if (state.enabled.size === state.tools.length) return null;
      return Array.from(state.enabled);
    }

    // ── Send ──
    async function sendMessage() {
      const query = input.value.trim();
      if (!query) return;

      const user = userIdInput.value.trim() || 'test-user';
      const tools = toolsPayload();

      sendBtn.disabled = true;
      input.disabled = true;
      setStatus('Sending…', 'load');

      appendMessage('user', query);
      input.value = '';
      autoGrow();

      try {
        const resp = await fetch(`${baseUrl()}/chat`, {
          method: 'POST',
          headers: headers(),
          body: JSON.stringify({ user, query, tools }),
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.detail || data.error || `HTTP ${resp.status}`);
        if (data.response) appendMessage('assistant', data.response);
        else appendMessage('assistant', '```json\n' + JSON.stringify(data, null, 2) + '\n```');
        setStatus('Ready', 'ok');
      } catch (err) {
        appendMessage('assistant', `Error: ${err.message}`, { isError: true });
        setStatus(`Error: ${err.message}`, 'err');
      } finally {
        sendBtn.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }
    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    // ── Auto-grow composer ──
    function autoGrow() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 220) + 'px';
    }
    input.addEventListener('input', autoGrow);

    // ── Boot ──
    loadState();
    input.focus();
    (async () => {
      await loadTools();
      await loadHistory(false);
    })();
  })();
</script>
</body>
</html>
